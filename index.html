<style>
  :root{
    --ink:#241f1a;
    --paper:#faf7f2;
    --panel:#ffffff;
    --line:#e4dcd0;
    --amber:#c8791f;
    --amber-deep:#9c5a12;
    --ok:#2f6f4f;
    --warn:#b8390e;
    --muted:#8a7f70;
    --mono: 'SF Mono', 'Consolas', 'Menlo', monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  *{box-sizing:border-box;}
  #mc-root, #mc-app{
    font-family:var(--sans);
    color:var(--ink);
    background:var(--paper);
    min-height:100%;
    padding:0;
    font-size:14px;
    line-height:1.4;
  }
  .mc-header{
    display:flex; align-items:baseline; justify-content:space-between;
    padding:20px 24px 14px 24px;
    border-bottom:2px solid var(--ink);
  }
  .mc-title{font-size:20px; font-weight:800; letter-spacing:-0.01em;}
  .mc-title span{color:var(--amber-deep);}
  .mc-sub{font-size:12px; color:var(--muted); font-family:var(--mono);}
  .mc-tabs{
    display:flex; flex-wrap:wrap; gap:2px;

  .mc-tab{
    padding:6px 12px; font-size:12.5px; font-weight:600; cursor:pointer;
    border-radius:5px; color:var(--muted); white-space:nowrap;
    border:1px solid transparent;
  }
  .mc-tab:hover{background:#e7ded0;}
  .mc-tab.active{background:var(--ink); color:var(--paper);}
  .mc-tabgroup-label{
    font-size:10px; text-transform:uppercase; letter-spacing:0.08em; color:var(--muted);
    padding:6px 8px 0 8px; width:100%; font-weight:700;
  }
  .mc-body{padding:20px 24px 60px 24px;}
  .mc-panel{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:18px; margin-bottom:16px;

  .mc-panel h2{margin:0 0 4px 0; font-size:15px;}
  .mc-panel .mc-desc{font-size:12px; color:var(--muted); margin-bottom:14px;}
  table.mc-table{width:100%; border-collapse:collapse; font-size:13px;}
  table.mc-table th{
    text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:0.05em;
    color:var(--muted); border-bottom:1px solid var(--line); padding:6px 8px; font-weight:700;
  }

  .mc-input{

    font-size:13px; font-family:var(--sans); background:#fff;
  }
  .mc-input:focus{outline:2px solid var(--amber); outline-offset:0; border-color:var(--amber);}
  .mc-input.mc-num{font-family:var(--mono); text-align:right;}
  .mc-btn{
    background:var(--ink); color:var(--paper); border:none; border-radius:6px;
    padding:7px 13px; font-size:12.5px; font-weight:700; cursor:pointer;
  }
  .mc-btn:hover{background:#3a3227;}
  .mc-btn.secondary{background:transparent; color:var(--ink); border:1px solid var(--line);}
  .mc-btn.secondary:hover{background:#f1ece2;}
  .mc-btn.danger{background:transparent; color:var(--warn); border:1px solid #e8c3b0;}
  .mc-btn:disabled{opacity:0.4; cursor:not-allowed;}
  .mc-pill{
    display:inline-block; font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:99px;
    font-family:var(--mono);
  }
  .mc-pill.ok{background:#e4f2ea; color:var(--ok);}
  .mc-pill.warn{background:#fbe9e0; color:var(--warn);}
  .mc-pill.info{background:#f1ece2; color:var(--muted);}
  .mc-flagrow{background:#fff8f0 !important;}
  .mc-row-yellow{background:#fdf1c4 !important;}
  .mc-row-red{background:#f7cdcd !important;}
  .mc-row-green{background:#d9f0e1 !important;}
  .mc-checkbox{width:16px; height:16px;}
  .mc-toolbar{display:flex; gap:8px; align-items:center; margin-bottom:12px; flex-wrap:wrap;}
  .mc-search{max-width:260px;}
  .mc-stat{
    display:flex; flex-direction:column; gap:2px; padding:14px 16px;
    background:#fff; border:1px solid var(--line); border-radius:10px; flex:1; min-width:140px;
  }
  .mc-stat .mc-stat-label{font-size:10.5px; text-transform:uppercase; letter-spacing:0.06em; color:var(--muted); font-weight:700;}
  .mc-stat .mc-stat-val{font-size:22px; font-weight:800; font-family:var(--mono);}
  .mc-statrow{display:flex; gap:12px; flex-wrap:wrap; margin-bottom:16px;}
  .mc-dropzone{
    border:2px dashed var(--line); border-radius:10px; padding:28px; text-align:center;
    color:var(--muted); font-size:13px; cursor:pointer; background:#fff;
  }
  .mc-dropzone:hover{border-color:var(--amber);}
  .mc-dropzone.drag{border-color:var(--amber); background:#fff8f0;}
  .mc-empty{color:var(--muted); font-size:13px; padding:20px; text-align:center;}
  .mc-flagtext{font-size:12px; color:var(--warn);}
  .mc-small{font-size:11px; color:var(--muted);}
  .mc-monthpick{font-family:var(--mono); font-size:13px; padding:5px 8px; border:1px solid var(--line); border-radius:6px;}
  a.mc-link{color:var(--amber-deep); cursor:pointer; text-decoration:underline; font-size:12px;}
  .mc-savebar{font-size:11px; color:var(--muted); font-family:var(--mono); display:flex; align-items:center; gap:6px;}
  .mc-dot{width:7px; height:7px; border-radius:99px; background:var(--ok); display:inline-block;}

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
(function(){

const SEED_ROSTER = []; // real data lives entirely in the connected Google Sheet now
const SEED_ROCK_BANDS = []; // real data lives entirely in the connected Google Sheet now

const TEACHERS = ["Carl Shepard","David Puthoff","Elisha Walker","Grant Hater","John Bertke","Logan Montgomery","Mary White","Nick Federinko","Sarah Gorak","Spencer Caudill","Yun-Huei Jen"];

let state = {
  roster: null,        // array of student rows
  rockSessions: null,   // array of { id, name, months:[label...], bands:[...] }
  imports: {},          // { "2026-07": {label, rows:[...], summary:{...}, importedAt} }
  activeTab: 'teacher:' + TEACHERS[0],
  activeImportMonth: null,
  _activeRockMonth: null,
};
function getActiveSession(){
  const sessions = state.rockSessions || [];
  return sessions.length ? sessions[sessions.length-1] : null;
}

// ---------- storage helpers ----------
const BACKEND_URL = 'https://script.google.com/macros/s/AKfycbwmre02-86JS46rpFi-zqkmt6i_QcuuIIpik4aqb6CYDtet00qAT0QDyjVTMzFQleqO/exec';

let SESSION_TOKEN = null;
let USER_EMAIL = null;
let _jsonpCounter = 0;

function jsonpRequest(params, timeoutMs){
  return new Promise((resolve, reject) => {
    const cbName = '_mc_jsonp_cb_' + (_jsonpCounter++) + '_' + Date.now();
    const timeout = setTimeout(() => {
      cleanup();
      reject(new Error('JSONP request timed out'));
    }, timeoutMs || 5000);

    function cleanup(){
      clearTimeout(timeout);
      // Replace with a harmless no-op rather than deleting outright - if the
      // underlying network request wasn't actually cancelled and a response
      // arrives late (after we've already given up and moved on), it will still
      // try to call this function. A missing function throws; a no-op doesn't.
      window[cbName] = () => {};
      if(script.parentNode) script.parentNode.removeChild(script);
    }

    window[cbName] = (data) => { cleanup(); resolve(data); };

    const qs = new URLSearchParams({ ...params, callback: cbName }).toString();
    const script = document.createElement('script');
    script.src = `${BACKEND_URL}?${qs}`;
    script.onerror = () => { cleanup(); reject(new Error('JSONP script failed to load')); };
    document.body.appendChild(script);
  });
}

// Exchanges a verified Google ID token for a short-lived session key - this is the
// ONLY call that sends the (long) Google token; everything after uses the much
// shorter session key instead, keeping regular requests small and fast.
async function backendGoogleLogin(idToken, _attempt, onProgress){
  const attempt = _attempt || 1;
  if(onProgress) onProgress(attempt);
  try{
    // A real Google ID token is often long enough to risk exceeding a safe request
    // URL length, so it's sent in small chunks - the same proven approach already
    // used for large data writes - rather than as one long request.
    const CHUNK_SIZE = 800;
    const chunks = [];
    for(let i=0; i<idToken.length; i+=CHUNK_SIZE) chunks.push(idToken.slice(i, i+CHUNK_SIZE));
    if(chunks.length === 0) chunks.push('');
    const uploadId = 'login' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
    let data = null;
    for(let i=0; i<chunks.length; i++){
      // 12s instead of the usual 5s - the final chunk triggers Apps Script making
      // its own outbound call to Google to verify the token, which takes real extra
      // time regular get/set requests never need.
      data = await jsonpRequest({
        action:'googleLoginChunk', uploadId,
        idx: i, total: chunks.length, chunk: chunks[i]
      }, 12000);
    }
    if(data.error === 'Unauthorized') return { unauthorized: true, reason: data.reason, detail: data.detail };
    if(data.error === 'ServerError') return { serverError: true, message: data.message };
    return { sessionToken: data.sessionToken, email: data.email };
  }catch(e){
    if(attempt < 4){
      await new Promise(r=>setTimeout(r, 300*attempt));
      return backendGoogleLogin(idToken, attempt+1, onProgress);
    }
    console.error('backendGoogleLogin failed after', attempt, 'attempts', e);
    return { networkError: true };
  }
}

async function backendGet(key, _attempt, onProgress){
  const attempt = _attempt || 1;
  if(onProgress) onProgress(attempt);
  try{
    const data = await jsonpRequest({ action:'get', key, session: SESSION_TOKEN });
    if(data.error === 'Unauthorized') return { unauthorized: true };
    if(!data.found) return { confirmedNotFound: true };
    return { value: data.value };
  }catch(e){
    if(attempt < 4){
      await new Promise(r=>setTimeout(r, 300*attempt));
      return backendGet(key, attempt+1, onProgress);
    }
    console.error('backendGet failed for', key, 'after', attempt, 'attempts', e);
    return { networkError: true };
  }
}
async function backendDelete(key, _attempt){
  const attempt = _attempt || 1;
  try{
    const data = await jsonpRequest({ action:'delete', key, session: SESSION_TOKEN });
    if(data.error === 'Unauthorized') return { unauthorized: true };
    return { success: true };
  }catch(e){
    if(attempt < 3){
      await new Promise(r=>setTimeout(r, 400*attempt));
      return backendDelete(key, attempt+1);
    }
    console.error('backendDelete failed for', key, 'after', attempt, 'attempts', e);
    return { networkError: true };
  }
}
async function backendSet(key, value, _attempt){
  const attempt = _attempt || 1;
  try{
    // JSON expands roughly 1.7x once URL-encoded (lots of quotes/braces/colons need
    // escaping) - keep chunks small enough that even with that expansion plus the
    // surrounding URL overhead, we stay comfortably under any reasonable server limit.
    const CHUNK_SIZE = 800;
    const chunks = [];
    for(let i=0; i<value.length; i+=CHUNK_SIZE){
      chunks.push(value.slice(i, i+CHUNK_SIZE));
    }
    if(chunks.length === 0) chunks.push('');
    const uploadId = 'u' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
    for(let i=0; i<chunks.length; i++){
      let chunkOk = false;
      let lastErr = null;
      for(let chunkAttempt=1; chunkAttempt<=3 && !chunkOk; chunkAttempt++){
        try{
          const data = await jsonpRequest({
            action:'setChunk', key, uploadId,
            idx: i, total: chunks.length, chunk: chunks[i],
            session: SESSION_TOKEN
          });
          if(data.error === 'Unauthorized') return { unauthorized: true };
          chunkOk = true;
        }catch(e){
          lastErr = e;
          if(chunkAttempt < 3) await new Promise(r=>setTimeout(r, 300*chunkAttempt));
        }
      }
      if(!chunkOk) throw lastErr || new Error('Chunk '+i+' failed');
    }
    return {};
  }catch(e){
    if(attempt < 3){
      await new Promise(r=>setTimeout(r, 400*attempt));
      return backendSet(key, value, attempt+1);
    }
    console.error('backendSet failed for', key, 'after', attempt, 'attempts', e);
    return { networkError: true };
  }
}

async function loadState(){
  state._loadError = null;

  const r = await backendGet('roster');
  if(r.value !== undefined){
    try{ state.roster = JSON.parse(r.value); }
    catch(e){ state._loadError = 'Your saved roster data looks corrupted and could not be read.'; state.roster = SEED_ROSTER.slice(); }
  } else if(r.confirmedNotFound){
    state.roster = SEED_ROSTER.slice();
  } else {
    // networkError or unauthorized: do NOT silently substitute seed data over real data
    state._loadError = 'Could not load your saved data (connection issue). Please refresh rather than editing right now.';
    state.roster = SEED_ROSTER.slice();
  }

  // One-time backfill: earlier roster entries never had isFounderFamily set at all
  // (the field didn't exist yet), so auto-detection - which only triggers when a
  // name is actively edited - never ran for them. Catch anyone already on the
  // roster whose last name matches, without needing their name to be re-typed.
  if(!state._loadError && Array.isArray(state.roster)){
    let backfilled = false;
    for(const s of state.roster){
      if(typeof s.isFounderFamily !== 'boolean'){
        s.isFounderFamily = isFounderFamilyName(s.studentName);
        backfilled = true;
      }
    }
    if(backfilled) await saveRoster();
  }

  const rb = await backendGet('rock-sessions');
  if(rb.value !== undefined){
    try{ state.rockSessions = JSON.parse(rb.value); }
    catch(e){ state._loadError = 'Your saved Rock Academy data looks corrupted and could not be read.'; state.rockSessions = null; }
  } else if(rb.confirmedNotFound){
    // Genuinely confirmed empty by the server - safe to run the one-time legacy migration/seed.
    let legacyBands = null;
    const legacy = await backendGet('rock-bands');
    if(legacy.value !== undefined){
      try{ legacyBands = JSON.parse(legacy.value); }catch(e){}
    }
    const sourceBands = legacyBands || SEED_ROCK_BANDS;
    const seeded = sourceBands.map(b => ({...b, monthlyClasses: (b.monthlyClasses || {})}));
    state.rockSessions = [{ id: 'session_summer_2026', name: 'Summer 2026', months: ['July 2026'], bands: seeded }];
    await saveRockSessions();
  } else {
    // networkError or unauthorized: never overwrite with seed data here.
    state._loadError = 'Could not load your saved Rock Academy data (connection issue). Please refresh rather than editing right now.';
    state.rockSessions = null;
  }

  const im = await backendGet('imports-index');
  if(im.value !== undefined){
    let months = [];
    try{ months = JSON.parse(im.value); }catch(e){ months = []; }
    for(const m of months){
      const rec = await backendGet('import:'+m);
      if(rec.value !== undefined){
        try{ state.imports[m] = JSON.parse(rec.value); }catch(e){}
      }
    }
    if(months.length) state.activeImportMonth = months[months.length-1];
  }
  // if imports-index is confirmedNotFound, that's a legitimate "no imports yet" - leave state.imports as {}
  // if it's a networkError/unauthorized, we simply won't have imports this load; not destructive since we never write imports-index here
}

async function verifiedBackendSet(key, value, _attempt){
  const attempt = _attempt || 1;
  await backendSet(key, value);
  // brief pause before checking - guards against checking the Sheet before a write
  // has fully landed, not just against outright network failures
  await new Promise(r=>setTimeout(r, 500));
  const check = await backendGet(key);
  if(check.value === value) return true;

  if(attempt < 3){
    console.warn('Save verification failed for', key, '- retrying (attempt', attempt+1, ')');
    return verifiedBackendSet(key, value, attempt+1);
  }
  console.error('Save verification failed for', key, 'after', attempt, 'attempts - Sheet did not reflect the new value.');
  return false;
}

async function saveRoster(){
  setSyncing();
  const ok = await verifiedBackendSet('roster', JSON.stringify(state.roster));
  if(ok){ setSynced(); } else { setSaveFailed('roster'); }
}
async function saveRockSessions(){
  setSyncing();
  const ok = await verifiedBackendSet('rock-sessions', JSON.stringify(state.rockSessions));
  if(ok){ setSynced(); } else { setSaveFailed('Rock Academy data'); }
}
async function saveImport(monthKey, indexChanged){
  setSyncing();
  const ok1 = await verifiedBackendSet('import:'+monthKey, JSON.stringify(state.imports[monthKey]));
  let ok2 = true;
  if(indexChanged){
    const months = sortImportMonthKeysChronologically(Object.keys(state.imports));
    ok2 = await verifiedBackendSet('imports-index', JSON.stringify(months));
  }
  if(ok1 && ok2){ setSynced(); } else { setSaveFailed('this import'); }
}
async function deleteImport(monthKey){
  setSyncing();
  delete state.imports[monthKey];
  if(state.activeImportMonth === monthKey) state.activeImportMonth = null;
  if(state._importDetailMonth === monthKey) state._importDetailMonth = null;
  await backendDelete('import:'+monthKey);
  const months = sortImportMonthKeysChronologically(Object.keys(state.imports));
  const ok = await verifiedBackendSet('imports-index', JSON.stringify(months));
  if(ok){ setSynced(); } else { setSaveFailed('the imports list'); }
  renderAll();
}
function setSyncing(){
  const b = document.getElementById('mc-savebar');
  if(b) b.innerHTML = '<span class="mc-dot" style="background:#c8791f"></span> saving…';
}
function setSynced(){
  const b = document.getElementById('mc-savebar');
  if(b) b.innerHTML = '<span class="mc-dot"></span> synced';
  state._saveError = null;
}
function setSaveFailed(whatFailed){
  const b = document.getElementById('mc-savebar');
  if(b) b.innerHTML = '<span class="mc-dot" style="background:#b8390e"></span> NOT SAVED';
  state._saveError = `Your last change to ${whatFailed} did NOT save — the Sheet still shows the old value. Please try the edit again, and check your connection.`;
  renderAll();
}

// ---------- utils ----------
function uid(){ return 's' + Math.random().toString(36).slice(2,10); }
function money(n){
  if(n===null||n===undefined||isNaN(n)) return '—';
  const neg = n<0;
  return (neg?'-':'') + '$' + Math.abs(n).toFixed(2);
}
function parseMonthLabelToDate(label){
  const d = new Date(label + ' 1'); // "August 2026" -> "August 2026 1", parses to Aug 1 2026
  return isNaN(d.getTime()) ? null : d;
}
function showIsInMonth(showDateStr, monthLabel){
  if(!showDateStr) return false;
  const showDate = new Date(showDateStr + 'T00:00:00'); // avoid timezone-shift edge cases
  const monthDate = parseMonthLabelToDate(monthLabel);
  if(!monthDate || isNaN(showDate.getTime())) return false;
  return showDate.getFullYear() === monthDate.getFullYear() && showDate.getMonth() === monthDate.getMonth();
}
// Sorts month keys (from state.imports) by the ACTUAL calendar date in their label,
// not alphabetically - "august-2026" would otherwise sort before "july-2026" since
// 'a' < 'j', which is backwards. Falls back to when it was imported if a label can't
// be parsed as a date at all.
function sortImportMonthKeysChronologically(monthKeys){
  return monthKeys.slice().sort((a,b)=>{
    const da = parseMonthLabelToDate(state.imports[a].label || a);
    const db = parseMonthLabelToDate(state.imports[b].label || b);
    if(da && db) return da - db;
    if(da && !db) return -1;
    if(!da && db) return 1;
    return (state.imports[a].importedAt||0) - (state.imports[b].importedAt||0);
  });
}
// Same idea for Rock Academy session.months, which are raw label strings, not keys.
function sortMonthLabelsChronologically(labels){
  return labels.slice().sort((a,b)=>{
    const da = parseMonthLabelToDate(a);
    const db = parseMonthLabelToDate(b);
    if(da && db) return da - db;
    if(da && !db) return -1;
    if(!da && db) return 1;
    return a.localeCompare(b);
  });
}

function esc(s){
  return (s===null||s===undefined) ? '' : String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function slugify(s){
  return (s||'').toString().toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
}

// Studio's standard split: $75 instructor / $43 rent out of $118 total, held at the same
// ratio for prorated amounts, rounded to the nearest $0.25 (matches actual sheet figures,
// e.g. $88.50 -> $32.25 rent / $56.25 instructor).
const INSTRUCTOR_RATIO = 75/118;
function splitPay(rate){
  if(rate===null||rate===undefined||isNaN(rate)) return {instructor:null, rent:null};
  const rawInstr = rate * INSTRUCTOR_RATIO;
  const instructor = Math.round(rawInstr*4)/4;
  const rent = Math.round((rate-instructor)*4)/4;
  return {instructor, rent};
}

// ---------- render shell ----------
function renderTabs(){
  const el = document.getElementById('mc-tabs');
  let html = '';
  html += tabBtn('summary', 'Studio P&L');
  html += tabBtn('flags', 'Flags & Discrepancies');
  html += tabBtn('payers', 'Payer Relationships');
  html += tabBtn('adminfee', 'Admin Fee');
  html += tabBtn('import', 'Monthly Import');
  html += '<div class="mc-tabgroup-label">Teachers</div>';
  for(const t of TEACHERS){
    html += tabBtn('teacher:'+t, t);
  }
  const activeSession = getActiveSession();
  html += `<div class="mc-tabgroup-label">Rock Academy — ${esc(activeSession ? activeSession.name : 'no session')}</div>`;
  html += tabBtn('rockoverview', 'Overview');
  for(const b of (activeSession ? activeSession.bands : [])){
    html += tabBtn('rockband:'+b.id, b.name);
  }
  html += tabBtn('rockshows', 'Shows');
  html += tabBtn('rocksessions', '+ Sessions');
  el.innerHTML = html;
  el.querySelectorAll('.mc-tab').forEach(b=>{
    b.addEventListener('click', ()=>{ state.activeTab = b.dataset.tab; renderAll(); });
  });
}
function tabBtn(key, label){
  const active = state.activeTab===key ? 'active' : '';
  return `<div class="mc-tab ${active}" data-tab="${esc(key)}">${esc(label)}</div>`;
}

function renderAll(){
  renderTabs();
  const body = document.getElementById('mc-body');
  let bannerHtml = '';
  if(state._loadError){
    bannerHtml += `<div style="background:#fbe9e0; border:1px solid #e8a67e; color:#9c3a0e; border-radius:8px; padding:12px 16px; margin-bottom:16px; font-size:13px;">
      <b>⚠ ${esc(state._loadError)}</b>
    </div>`;
  }
  if(state._saveError){
    bannerHtml += `<div style="background:#fbe0e0; border:1px solid #e89a9a; color:#9c1e1e; border-radius:8px; padding:12px 16px; margin-bottom:16px; font-size:13px;">
      <b>⚠ ${esc(state._saveError)}</b>
    </div>`;
  }
  if(state.activeTab === 'summary') body.innerHTML = bannerHtml + renderSummary();
  else if(state.activeTab === 'flags') { body.innerHTML = bannerHtml + renderFlags(); }
  else if(state.activeTab === 'payers') body.innerHTML = bannerHtml + renderPayers();
  else if(state.activeTab === 'adminfee') body.innerHTML = bannerHtml + renderAdminFee();
  else if(state.activeTab === 'import') { body.innerHTML = bannerHtml; renderImportTab(body); }
  else if(state.activeTab.startsWith('teacher:')) body.innerHTML = bannerHtml + renderTeacher(state.activeTab.slice(8));
  else if(state.activeTab === 'rockoverview') body.innerHTML = bannerHtml + renderRockOverview();
  else if(state.activeTab.startsWith('rockband:')) body.innerHTML = bannerHtml + renderRockBand(state.activeTab.slice(9));
  else if(state.activeTab === 'rockshows') body.innerHTML = bannerHtml + renderRockShows();
  else if(state.activeTab === 'rocksessions') body.innerHTML = bannerHtml + renderRockSessions();
  attachRosterHandlers();
  attachPayerHandlers();
  attachAdminFeeHandlers();
  attachRockHandlers();
  attachRockShowsHandlers();
}

// Studio's Rock Academy per-class teacher rates
const STANDARD_BAND_PER_CLASS_RATE = 50; // per teacher, per class, standard ($116) bands
const HOUSE_BAND_PER_CLASS_RATE = 67;     // per teacher, per class, House Band ($151, 2hr)
function calcBandPay(band, monthLabel){
  const perClassRate = band.tier === 'house_band' ? HOUSE_BAND_PER_CLASS_RATE : STANDARD_BAND_PER_CLASS_RATE;
  const classes = (band.monthlyClasses && typeof band.monthlyClasses[monthLabel] === 'number')
    ? band.monthlyClasses[monthLabel] : 4;
  const teacherCount = [band.teacher1, band.teacher2].filter(Boolean).length;
  const revenue = band.members.reduce((a,m)=> a + (m.freeViaHouseBand ? 0 : (m.rate||0)), 0);
  const instructorTotal = classes * perClassRate * teacherCount;
  const rent = revenue - instructorTotal;
  const perTeacher = teacherCount>0 ? (classes * perClassRate) : 0;
  return { classes, teacherCount, revenue, instructorTotal, rent, perTeacher, perClassRate };
}
function calcBandPaySessionTotal(band, months){
  let instructorTotal=0, rent=0, revenue=0;
  for(const m of months){
    const p = calcBandPay(band, m);
    instructorTotal += p.instructorTotal; rent += p.rent; revenue += p.revenue;
  }
  return { instructorTotal, rent, revenue };
}

// ---------- Rock Academy: sync payer info from Private Lessons ----------
// Almost every Rock Academy student also takes private lessons, so their payer/email
// is already correct over there. A small number of students don't take private lessons
// at all and will need their payer info entered manually on their Rock Academy row -
// this just reports who those are rather than guessing.

function syncRockPayersFromPrivateLessons(){
  const session = getActiveSession();
  if(!session) return;
  const rosterByName = {};
  for(const r of state.roster){
    rosterByName[r.studentName.trim().toLowerCase()] = r;
  }

  let synced = 0, alreadyHad = 0, unmatched = [];

  for(const band of session.bands){
    for(const m of band.members){
      const nameKey = m.studentName.trim().toLowerCase();
      const hasInfo = (m.payerName && m.payerName.trim()) || (m.email && m.email.trim());
      if(hasInfo){ alreadyHad++; continue; }

      const match = rosterByName[nameKey];
      if(match){
        m.payerName = match.payerName || match.studentName;
        m.email = match.email || '';
        synced++;
      } else {
        unmatched.push(`${m.studentName} (${band.name})`);
      }
    }
  }

  saveRockSessions();
  renderAll();

  let msg = `Synced ${synced} student${synced===1?'':'s'} from Private Lessons.`;
  if(alreadyHad) msg += ` ${alreadyHad} already had payer info and were left untouched.`;
  if(unmatched.length) msg += `\n\nStill need manual entry (no matching private lesson found):\n- ${unmatched.join('\n- ')}`;
  alert(msg);
}

function attachRockShowsHandlers(){
  const session = getActiveSession();
  if(!session) return;
  if(!session.shows) session.shows = [];

  const addBtn = document.getElementById('mc-add-show-btn');
  if(addBtn) addBtn.addEventListener('click', ()=>{
    session.shows.push({ id:'show'+Math.random().toString(36).slice(2,9), date:'', name:'New show', teachers:[] });
    saveRockSessions(); renderAll();
  });

  document.querySelectorAll('[data-showfield]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const show = session.shows.find(s=>s.id===el.dataset.show);
      if(!show) return;
      show[el.dataset.showfield] = el.value;
      saveRockSessions(); renderAll();
    });
  });

  document.querySelectorAll('[data-showteacher]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const show = session.shows.find(s=>s.id===el.dataset.show);
      if(!show) return;
      const teacher = el.dataset.showteacher;
      if(!show.teachers) show.teachers = [];
      if(el.checked){
        if(!show.teachers.includes(teacher)) show.teachers.push(teacher);
      } else {
        show.teachers = show.teachers.filter(t=>t!==teacher);
      }
      saveRockSessions(); renderAll();
    });
  });

  document.querySelectorAll('[data-action="delete-show"]').forEach(b=>{
    b.addEventListener('click', ()=>{
      if(!confirm('Remove this show?')) return;
      session.shows = session.shows.filter(s=>s.id!==b.dataset.show);
      saveRockSessions(); renderAll();
    });
  });
}

function attachRockHandlers(){

      if(!session) return;
      const band = session.bands.find(b=>b.id===el.dataset.band);

      band[el.dataset.rockfield] = el.value;
      saveRockSessions(); renderAll();
    });
  });
  document.querySelectorAll('[data-rockmonth="classes"]').forEach(el=>{
    el.addEventListener('change', ()=>{
      if(!session) return;
      const band = session.bands.find(b=>b.id===el.dataset.band);
      if(!band) return;
      const month = el.dataset.month;
      if(!band.monthlyClasses) band.monthlyClasses = {};
      band.monthlyClasses[month] = el.value===''? 4 : parseFloat(el.value);
      saveRockSessions(); renderAll();
    });
  });
  const rbMonthSel = document.getElementById('mc-rockband-month-select');
  if(rbMonthSel) rbMonthSel.addEventListener('change', ()=>{
    state._activeRockMonth = rbMonthSel.value; renderAll();
  });
  document.querySelectorAll('[data-rockmember]').forEach(el=>{
    el.addEventListener('change', ()=>{
      if(!session) return;
      const band = session.bands.find(b=>b.id===el.dataset.band);
      if(!band) return;
      const m = band.members.find(x=>x.id===el.dataset.mid);
      if(!m) return;
      const field = el.dataset.rockmember;
      if(el.type==='checkbox'){
        m[field] = el.checked;
        if(field==='freeViaHouseBand' && el.checked) m.rate = null;
      } else if(field==='rate'){
        m[field] = el.value===''? null : parseFloat(el.value);
      } else {
        m[field] = el.value;
      }
      saveRockSessions(); renderAll();
    });
  });
  document.querySelectorAll('[data-action="add-rock-member"]').forEach(b=>{
    b.addEventListener('click', ()=>{
      if(!session) return;
      const band = session.bands.find(x=>x.id===b.dataset.band);
      if(!band) return;
      const defaultRate = band.tier==='house_band' ? 151 : 116;
      band.members.push({ id:'rm'+Math.random().toString(36).slice(2,9), studentName:'New student', payerName:'', email:'', rate:defaultRate, freeViaHouseBand:false });
      saveRockSessions(); renderAll();
    });
  });
  document.querySelectorAll('[data-action="delete-rock-member"]').forEach(b=>{
    b.addEventListener('click', ()=>{
      if(!confirm('Remove this student from the band?')) return;
      if(!session) return;
      const band = session.bands.find(x=>x.id===b.dataset.band);
      if(!band) return;
      band.members = band.members.filter(m=>m.id!==b.dataset.mid);
      saveRockSessions(); renderAll();
    });
  });
}


// ---------- Teacher tab ----------
// Finds the most recent import's flag result for a specific teacher+student, so the
// Teacher tab can visually reflect "this person had a real payment problem last time
// we checked" without needing to re-run reconciliation live.
function getLatestFlagForStudent(teacherName, studentName){
  const monthKeys = sortImportMonthKeysChronologically(Object.keys(state.imports));
  for(let i=monthKeys.length-1; i>=0; i--){
    const data = state.imports[monthKeys[i]];
    const row = data.rows.find(r=>r.teacher===teacherName && r.student===studentName);
    if(row) return row;
  }
  return null;
}
// "Real" problems that should red-out a row on the Teacher tab - deliberately excludes
// rock_bundle (payment succeeded, just can't isolate the exact split) since that's not
// actually a problem, and excludes anything already resolved (e.g. marked inactive).
function isRealPaymentProblem(flagRow){
  if(!flagRow || flagRow.flag==='OK' || flagRow.resolved) return false;
  const cat = categorizeFlag(flagRow.flag);
  return cat==='card_failure' || cat==='mismatch' || cat==='not_found' || cat==='refund';
}

function renderTeacher(teacherName){
  const rows = state.roster.filter(s=>s.teacher===teacherName);
  const active = rows.filter(r=>r.active);
  const inactive = rows.filter(r=>!r.active);
  let html = `<div class="mc-panel">
    <h2>${esc(teacherName)}</h2>
    <div class="mc-desc">${active.length} active student${active.length===1?'':'s'} · ${inactive.length} inactive · rent/instructor split at $75/$118 ratio, rounded to nearest $0.25 · a student shown in red has a payment issue flagged in the latest import - still paid as normal, just worth checking · green rows are founder-family free lessons</div>
    <div class="mc-toolbar">
      <button class="mc-btn" data-action="add-student" data-teacher="${esc(teacherName)}">+ Add student</button>
      <button class="mc-btn secondary" data-action="toggle-inactive" data-teacher="${esc(teacherName)}">${state._showInactive? 'Hide':'Show'} inactive</button>
    </div>
    <table class="mc-table">
      <thead><tr>
        <th style="width:14%">Student</th>
        <th style="width:13%">Payer (if different)</th>
        <th style="width:15%">Email</th>
        <th style="width:9%">Monthly rate</th>
        <th style="width:8%">Rent</th>
        <th style="width:8%">Instructor</th>
        <th style="width:8%" title="Free lessons for founder's family (Beck/Kissell) - $75 paid from studio rent">Founder family</th>
        <th style="width:8%" title="Manually set a custom Rent/Instructor split for one-off arrangements">Custom split</th>
        <th style="width:6%">Active</th>
        <th style="width:5%"></th>
      </tr></thead>
      <tbody>`;
  const list = state._showInactive ? rows : active;
  let sumTotal=0, sumRent=0, sumInstructor=0;
  for(const s of list){
    const latestFlag = getLatestFlagForStudent(s.teacher, s.studentName);
    const hasRealProblem = s.active && isRealPaymentProblem(latestFlag);

    let instructor, rent;
    if(s.isFounderFamily){
      instructor = 75;
      rent = -75;
    } else if(s.customSplit){
      instructor = (typeof s.customInstructor === 'number') ? s.customInstructor : 0;
      rent = (typeof s.customRent === 'number') ? s.customRent : 0;
    } else {
      const split = splitPay(s.monthlyRate);
      instructor = split.instructor;
      rent = split.rent;
    }

    if(s.active){
      if(s.isFounderFamily){
        sumInstructor += instructor;
        sumRent += rent;
      } else if(typeof s.monthlyRate === 'number'){
        sumTotal += s.monthlyRate;
        sumRent += (rent||0);
        sumInstructor += (instructor||0);
      }
    }

    let rowClass = '';
    if(!s.active) rowClass = 'mc-row-yellow';
    else if(s.isFounderFamily) rowClass = 'mc-row-green';
    else if(hasRealProblem) rowClass = 'mc-row-red';

    const rentCell = s.customSplit
      ? `<input class="mc-input mc-num" data-field="customRent" data-id="${s.id}" value="${s.customRent!=null?s.customRent:''}">`
      : `<span${s.isFounderFamily?' title="Paid from studio rent budget"':''}>${rent!==null?money(rent):'—'}</span>`;
    const instructorCell = s.customSplit
      ? `<input class="mc-input mc-num" data-field="customInstructor" data-id="${s.id}" value="${s.customInstructor!=null?s.customInstructor:''}">`
      : `<span${s.isFounderFamily?' title="Flat $75 - free lesson, founder family"':''}>${instructor!==null?money(instructor):'—'}</span>`;

    html += `<tr data-id="${s.id}" class="${rowClass}">
      <td><input class="mc-input" data-field="studentName" data-id="${s.id}" value="${esc(s.studentName)}"></td>
      <td><input class="mc-input" data-field="payerName" data-id="${s.id}" value="${esc(s.payerName)}" placeholder="same as student"></td>
      <td><input class="mc-input" data-field="email" data-id="${s.id}" value="${esc(s.email)}" placeholder="payer email"></td>
      <td><input class="mc-input mc-num" data-field="monthlyRate" data-id="${s.id}" value="${s.monthlyRate!==null&&s.monthlyRate!==undefined?s.monthlyRate:''}"></td>
      <td class="mc-small" style="text-align:right; font-family:var(--mono)">${rentCell}</td>
      <td class="mc-small" style="text-align:right; font-family:var(--mono)">${instructorCell}</td>
      <td style="text-align:center"><input type="checkbox" class="mc-checkbox" data-founder-toggle data-id="${s.id}" ${s.isFounderFamily?'checked':''}></td>
      <td style="text-align:center"><input type="checkbox" class="mc-checkbox" data-field="customSplit" data-id="${s.id}" ${s.customSplit?'checked':''}></td>
      <td style="text-align:center"><input type="checkbox" class="mc-checkbox" data-field="active" data-id="${s.id}" ${s.active?'checked':''}></td>
      <td><button class="mc-btn danger" data-action="delete-student" data-id="${s.id}">✕</button></td>
    </tr>`;
  }

  // Rock Academy, folded into this same table as one row - only shown if this teacher
  // is actually involved (assigned to a band, or worked a show this month).
  const session = getActiveSession();
  if(session){
    const months = sortMonthLabelsChronologically(session.months);
    const monthLabel = (state._activeRockMonth && months.includes(state._activeRockMonth))
      ? state._activeRockMonth : months[months.length-1];
    const bandsForTeacher = session.bands.filter(b=>b.teacher1===teacherName || b.teacher2===teacherName);
    const showsThisMonth = (session.shows||[]).filter(sh =>
      (sh.teachers||[]).includes(teacherName) && showIsInMonth(sh.date, monthLabel));

    if(bandsForTeacher.length > 0 || showsThisMonth.length > 0){
      const bandPay = monthLabel ? bandsForTeacher.reduce((a,b)=> a + calcBandPay(b, monthLabel).perTeacher, 0) : 0;
      const showPay = showsThisMonth.length * SHOW_TEACHER_PAY;
      const rockTotal = bandPay + showPay;
      sumInstructor += rockTotal; // folds into the same income total as private lessons

      const bandNames = bandsForTeacher.map(b=>b.name);
      let label = bandNames.join(', ');
      if(showsThisMonth.length > 0){
        label += (label ? ', ' : '') + `${showsThisMonth.length} show${showsThisMonth.length===1?'':'s'}`;
      }

      html += `<tr>
        <td colspan="3"><b>Rock Academy${monthLabel?` (${esc(monthLabel)})`:''}</b>${label?` — ${esc(label)}`:''}</td>
        <td class="mc-small">—</td>
        <td class="mc-small">—</td>
        <td class="mc-small" style="text-align:right; font-family:var(--mono)"><b>${money(rockTotal)}</b></td>
        <td colspan="3"></td>
      </tr>`;
    }
  }

  html += `</tbody>
    <tfoot>
      <tr style="border-top:2px solid var(--ink); font-weight:800;">
        <td colspan="3">TOTALS (all active students + Rock Academy)</td>
        <td style="font-family:var(--mono)">${money(sumTotal)}</td>
        <td style="font-family:var(--mono)">${money(sumRent)}</td>
        <td style="font-family:var(--mono)">${money(sumInstructor)}</td>
        <td colspan="3"></td>
      </tr>
    </tfoot>
    </table></div>`;

  html += renderTeacherHistory(teacherName);
  return html;
}

// Shared action: marks a student inactive on their roster, and marks the specific
// import row that triggered it as resolved - used from both the Flags tab and the
// Monthly Import detail view, since both can surface a "not found" row.
async function markStudentInactiveFromImportRow(monthKey, rowIdx){
  const importData = state.imports[monthKey];
  if(!importData) return;
  const flagRow = importData.rows[rowIdx];
  if(!flagRow) return;
  const rosterEntry = state.roster.find(s=>s.teacher===flagRow.teacher && s.studentName===flagRow.student);
  if(!rosterEntry){
    alert(`Couldn't find ${flagRow.student} on ${flagRow.teacher}'s roster to mark inactive - they may have already been renamed or removed.`);
    return;
  }
  if(!confirm(`Mark ${flagRow.student} (${flagRow.teacher}) as inactive? They'll no longer show up as an active student, and won't be flagged as "not found" in future imports.`)) return;
  rosterEntry.active = false;
  await saveRoster();
  flagRow.resolved = true;
  await verifiedBackendSet('import:'+monthKey, JSON.stringify(importData));
  renderAll();
}

// ---------- Flags & Discrepancies tab ----------
function categorizeFlag(flag){
  if(flag==='OK') return 'ok';
  if(flag.startsWith('UNRESOLVED FAILED PAYMENT')) return 'card_failure';
  if(flag.startsWith('NOT FOUND')) return 'not_found';
  if(flag.startsWith('REFUND')) return 'refund';
  if(flag.startsWith('AMOUNT MISMATCH')) return 'mismatch';
  if(flag.startsWith('includes Rock Academy')) return 'rock_bundle';
  if(flag.startsWith('includes $30 admin fee')) return 'admin_fee';
  return 'other';
}
// Single source of truth for "is this actually a problem, or just informational?" -
// used consistently for matched/flagged counts, revenue rollup, and coloring, so a
// verified bundled charge behaves the same as a plain OK everywhere in the app.
function isAccountedFor(flag){
  const cat = categorizeFlag(flag);
  return cat==='ok' || cat==='rock_bundle' || cat==='admin_fee';
}
const FLAG_LABELS = {
  card_failure: 'Card / payment failure — no successful retry yet',
  not_found: 'Active student not found in this month\u2019s WellnessLiving export',
  refund: 'Refund on account — needs manual review',
  mismatch: 'Amount collected doesn\u2019t match roster rate',
  rock_bundle: 'Bundled with Rock Academy (payment OK, can\u2019t isolate private-lesson $ precisely)',
  admin_fee: '$30 admin fee detected and marked paid automatically',
  other: 'Other',
};
const FLAG_ORDER = ['card_failure','mismatch','not_found','refund','rock_bundle','admin_fee','other'];

function renderFlags(){
  const months = sortImportMonthKeysChronologically(Object.keys(state.imports));
  if(!months.length){
    return `<div class="mc-panel"><h2>Flags &amp; Discrepancies</h2>
      <div class="mc-empty">Nothing to check yet — import a month's WellnessLiving export first, and anything needing a look (card failures, mismatched amounts, missing students) will show up here automatically.</div></div>`;
  }
  const monthKey = state._flagsMonth && state.imports[state._flagsMonth] ? state._flagsMonth : months[months.length-1];
  const data = state.imports[monthKey];
  const rows = data.rows.filter(r=>r.flag!=='OK');

  const grouped = {};
  for(const cat of FLAG_ORDER) grouped[cat] = [];
  for(const r of rows){
    const cat = categorizeFlag(r.flag);
    (grouped[cat] || (grouped[cat]=[])).push(r);
  }

  let html = `<div class="mc-panel">
    <h2>Flags &amp; Discrepancies</h2>
    <div class="mc-desc">Everything that needs your eyes for the selected month — card failures, mismatched amounts, missing students, refunds, and Rock-Academy-bundled charges.</div>
    <div class="mc-toolbar">
      <label class="mc-small">Month:</label>
      <select class="mc-monthpick" id="mc-flags-month-select">
        ${months.map(m=>`<option value="${m}" ${m===monthKey?'selected':''}>${esc(state.imports[m].label||m)}</option>`).join('')}
      </select>
    </div>
    <div class="mc-statrow">
      ${FLAG_ORDER.filter(c=>grouped[c].length>0 || c==='card_failure' || c==='mismatch').map(cat=>{
        const n = grouped[cat].length;
        const isGoodCategory = cat==='rock_bundle' || cat==='admin_fee';
        const color = isGoodCategory ? '#2f6f4f' : (n>0?'#b8390e':'#2f6f4f');
        return `<div class="mc-stat"><div class="mc-stat-label">${esc(FLAG_LABELS[cat])}</div><div class="mc-stat-val" style="color:${color}">${n}</div></div>`;
      }).join('')}
    </div>
  </div>`;

  if(!rows.length){
    html += `<div class="mc-panel"><div class="mc-empty">No private-lesson flags for ${esc(data.label||monthKey)} — everything matched cleanly.</div></div>`;
  } else {
    for(const cat of FLAG_ORDER){
      if(!grouped[cat].length) continue;
      const rowClass = (cat==='rock_bundle' || cat==='admin_fee') ? 'mc-row-green' : 'mc-flagrow';
      html += `<div class="mc-panel">
        <h2>${esc(FLAG_LABELS[cat])}</h2>
        <div class="mc-desc">${grouped[cat].length} item${grouped[cat].length===1?'':'s'}</div>
        <table class="mc-table">
          <thead><tr><th>Teacher</th><th>Student</th><th>Payer</th><th>Expected</th><th>Collected</th><th>Detail</th>${cat==='not_found'?'<th></th>':''}</tr></thead>
          <tbody>
            ${grouped[cat].map(r=>{
              const rowIdx = data.rows.indexOf(r);
              const actionCell = cat==='not_found'
                ? (r.resolved
                    ? `<td><span class="mc-pill info">✓ marked inactive</span></td>`
                    : `<td><button class="mc-btn secondary" data-action="mark-inactive-from-flag" data-row-idx="${rowIdx}">Mark inactive</button></td>`)
                : '';
              return `<tr class="${rowClass}">
              <td>${esc(r.teacher)}</td><td>${esc(r.student)}</td><td class="mc-small">${esc(r.payer)}</td>
              <td>${r.expected!=null?money(r.expected):'—'}</td><td>${r.wlCollected!=null?money(r.wlCollected):'—'}</td>
              <td class="mc-flagtext">${esc(r.flag)}</td>${actionCell}
            </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>`;
    }
  }

  // Rock Academy flags for this same import, if this month's report was matched against a session
  const rockFlags = data.rockFlags || [];
  const rockFlagged = rockFlags.filter(r=>r.flag!=='OK');
  const rockOk = rockFlags.filter(r=>r.flag==='OK');
  if(rockFlags.length){
    html += `<div class="mc-panel">
      <h2>Rock Academy — ${esc(data.label||monthKey)}</h2>
      <div class="mc-toolbar">
        <span class="mc-pill ok">${rockOk.length} matched</span>
        <span class="mc-pill warn">${rockFlagged.length} flagged</span>
      </div>`;
    if(!rockFlagged.length){
      html += `<div class="mc-empty">No Rock Academy flags for ${esc(data.label||monthKey)} — every paid enrollment matched cleanly.</div></div>`;
    } else {
      html += `<table class="mc-table">
        <thead><tr><th>Band</th><th>Student</th><th>Payer</th><th>Detail</th></tr></thead>
        <tbody>
          ${rockFlagged.map(r=>`<tr class="mc-flagrow">
            <td>${esc(r.band)}</td><td>${esc(r.student)}</td><td class="mc-small">${esc(r.payer)}</td>
            <td class="mc-flagtext">${esc(r.flag)}</td>
          </tr>`).join('')}
        </tbody>
      </table></div>`;
    }
  }

  setTimeout(()=>{
    const sel = document.getElementById('mc-flags-month-select');
    if(sel) sel.addEventListener('change', ()=>{ state._flagsMonth = sel.value; renderAll(); });
    document.querySelectorAll('[data-action="mark-inactive-from-flag"]').forEach(b=>{
      b.addEventListener('click', ()=>{
        markStudentInactiveFromImportRow(monthKey, parseInt(b.dataset.rowIdx, 10));
      });
    });
  }, 0);
  return html;
}

      const row = state.roster.find(s=>s.id===id);
      if(!row) return;
      row.adminFeePaid = e.target.checked;
      saveRoster();
    });
  }
}

function isFounderFamilyName(name){
  const lastName = (name||'').trim().split(/\s+/).pop() || '';
  return ['beck','kissell'].includes(lastName.toLowerCase());
}

function attachRosterHandlers(){
  document.querySelectorAll('[data-field]').forEach(el=>{
    const evt = el.type === 'checkbox' ? 'change' : 'change';

      const id = el.dataset.id;

      if(el.type === 'checkbox') row[field] = el.checked;
      else if(field==='monthlyRate' || field==='customRent' || field==='customInstructor') row[field] = el.value===''? null : parseFloat(el.value);

// ---------- CSV parsing (WellnessLiving quirks: UTF-16LE + tab-delimited) ----------
async function readFileSmart(file){
  const buf = await file.arrayBuffer();
  const bytes = new Uint8Array(buf.slice(0,4));
  let text;
  if(bytes[0]===0xFF && bytes[1]===0xFE){
    text = new TextDecoder('utf-16le').decode(buf);
  } else if(bytes[0]===0xFE && bytes[1]===0xFF){
    text = new TextDecoder('utf-16be').decode(buf);
  } else {
    text = new TextDecoder('utf-8').decode(buf);
  }
  return text;
}
function detectDelimiter(text){
  const firstLine = text.split(/\r?\n/)[0] || '';
  const tabs = (firstLine.match(/\t/g)||[]).length;
  const commas = (firstLine.match(/,/g)||[]).length;
  return tabs > commas ? '\t' : ',';
}
function parseMoney(x){
  if(x===null||x===undefined) return 0;
  const s = String(x).replace(/[$,]/g,'').trim();
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}

async function handleFile(file){
  const statusEl = document.getElementById('mc-import-status');
  statusEl.textContent = 'Reading file…';
  try{
    const text = await readFileSmart(file);
    const delim = detectDelimiter(text);
    const parsed = Papa.parse(text, { header:true, delimiter: delim, skipEmptyLines:true });
    if(parsed.errors && parsed.errors.length){
      console.warn('CSV parse warnings', parsed.errors);
    }
    const rows = parsed.data;
    statusEl.textContent = `Parsed ${rows.length} transaction rows. Matching against roster…`;
    const result = runReconciliation(rows);
    if(result.rosterChanged) await saveRoster(); // e.g. $30 admin fee auto-detected and checked off
    const label = document.getElementById('mc-month-label').value.trim() || guessMonthLabel(rows) || 'Untitled month';
    const monthKey = label.toLowerCase().replace(/[^a-z0-9]+/g,'-');

    // Also match Rock Academy charges from the same report against the active session's bands
    const session = getActiveSession();
    let rockFlags = [];
    if(session){
      const isNewMonth = !session.months.includes(label);
      if(isNewMonth) session.months.push(label);
      rockFlags = runRockReconciliation(rows);
      // Only re-upload the whole Rock Academy dataset (all bands/members/shows/class
      // counts) if this month label is actually new - re-running the same month while
      // troubleshooting shouldn't resend data that hasn't changed at all.
      if(isNewMonth) await saveRockSessions();
    }

    const isNewImportMonth = !(monthKey in state.imports);
    state.imports[monthKey] = { label, rows: result.rows, summary: result.summary, rockFlags, importedAt: Date.now() };
    state.activeImportMonth = monthKey;
    state._activeRockMonth = label;
    await saveImport(monthKey, isNewImportMonth);
    const rockOk = rockFlags.filter(r=>r.flag==='OK').length;
    const rockFlagged = rockFlags.filter(r=>r.flag!=='OK').length;
    statusEl.textContent = `Done — private lessons: ${result.rows.filter(r=>isAccountedFor(r.flag)).length} matched, ${result.rows.filter(r=>!isAccountedFor(r.flag)).length} flagged. Rock Academy: ${rockOk} matched, ${rockFlagged} flagged.`;
    state._importDetailMonth = monthKey;
    renderAll();
  }catch(err){
    console.error(err);
    statusEl.textContent = 'Something went wrong reading that file: ' + err.message;
  }
}
function guessMonthLabel(rows){
  const first = rows.find(r=>r.Date);
  if(!first) return null;
  const d = new Date(first.Date);
  if(isNaN(d)) return null;
  return d.toLocaleString('default',{month:'long', year:'numeric'});
}

// ---------- Rock Academy reconciliation (same report, matched against active session's bands) ----------
function detectRockItem(row){
  const items = (row.Items||'').toLowerCase();
  const cat = (row['Revenue Category']||'').toLowerCase();
  return items.includes('rock') || cat.includes('rock');
}
function runRockReconciliation(salesRows){
  const norm = s => (s||'').toString().trim().toLowerCase();
  const byEmail = {};
  const byClient = {};
  for(const row of salesRows){
    if(!detectRockItem(row)) continue;
    const email = norm(row.Email);
    const client = norm(row.Client);
    const amt = parseMoney(row['Total Paid']);
    const status = (row['Payment Status']||'').trim();
    const collected = (status==='Successful' || status==='Account Debited') ? amt : 0;
    const isFail = status==='Failed';
    if(email && email!=='nan'){
      if(!byEmail[email]) byEmail[email] = {anyCollected:false, anyFail:false, payer:row.Client};
      const g = byEmail[email]; if(collected>0) g.anyCollected=true; if(isFail) g.anyFail=true;
    }
    if(client){
      if(!byClient[client]) byClient[client] = {anyCollected:false, anyFail:false, payer:row.Client};
      const g = byClient[client]; if(collected>0) g.anyCollected=true; if(isFail) g.anyFail=true;
    }
  }
  const results = [];
  const session = getActiveSession();
  if(!session) return results;
  for(const band of session.bands){
    for(const m of band.members){
      if(m.freeViaHouseBand) continue; // no charge expected for a free HB second-band slot
      const email = norm(m.email);
      const payerGuess = norm(m.payerName || m.studentName);
      let idx = null;
      if(email && byEmail[email]) idx = byEmail[email];
      else if(byClient[payerGuess]) idx = byClient[payerGuess];

      // Fallback: most Rock Academy students also take private lessons, and that
      // roster already has correct payer/email. Use it automatically rather than
      // requiring the "Sync payer info" button to have been run first.
      if(!idx){
        const privateMatch = state.roster.find(r =>
          r.studentName.trim().toLowerCase() === m.studentName.trim().toLowerCase());
        if(privateMatch){
          const privEmail = norm(privateMatch.email);
          const privPayerGuess = norm(privateMatch.payerName || privateMatch.studentName);
          if(privEmail && byEmail[privEmail]) idx = byEmail[privEmail];
          else if(byClient[privPayerGuess]) idx = byClient[privPayerGuess];
        }
      }

      let flag = 'OK';
      if(!idx) flag = 'NOT FOUND IN WL EXPORT (Rock Academy)';
      else if(idx.anyFail && !idx.anyCollected) flag = 'UNRESOLVED FAILED PAYMENT (Rock Academy)';
      results.push({ band: band.name, bandId: band.id, student: m.studentName,
        payer: idx ? idx.payer : (m.payerName||m.studentName), flag });
    }
  }
  return results;
}

// ---------- Reconciliation logic (mirrors the matching approach validated earlier) ----------
// Looks up what a specific payer actually owes for Rock Academy this session, by
// matching against the same email/payer-name used on the private lesson side - lets
// bundled charges be verified against real numbers instead of just assumed correct.
function getRockAcademyExpectedForPayer(email, payerNameGuess){
  const session = getActiveSession();
  if(!session) return { amount: 0, members: [] };
  const normEmail = (email||'').trim().toLowerCase();
  const normPayer = (payerNameGuess||'').trim().toLowerCase();
  let amount = 0;
  const members = [];
  for(const band of session.bands){
    for(const m of band.members){
      if(m.freeViaHouseBand) continue; // no charge expected for a free HB second-band slot
      const mEmail = (m.email||'').trim().toLowerCase();
      const mPayer = (m.payerName || m.studentName || '').trim().toLowerCase();
      let matches = (normEmail && mEmail && mEmail===normEmail) || (normPayer && mPayer===normPayer);

      // Fallback: this Rock Academy member's own payer info may be blank - check
      // whether their name matches a private-lesson roster entry with this payer instead.
      if(!matches){
        const privateMatch = state.roster.find(r =>
          r.studentName.trim().toLowerCase() === m.studentName.trim().toLowerCase());
        if(privateMatch){
          const privEmail = (privateMatch.email||'').trim().toLowerCase();
          const privPayer = (privateMatch.payerName || privateMatch.studentName || '').trim().toLowerCase();
          matches = (normEmail && privEmail && privEmail===normEmail) || (normPayer && privPayer===normPayer);
        }
      }

      if(matches && typeof m.rate === 'number'){
        amount += m.rate;
        members.push(`${m.studentName} (${band.name})`);
      }
    }
  }
  return { amount, members };
}

// Same idea as above, but for one specific student by name - used to correctly
// attribute Rock Academy money to whichever sibling actually has it, rather than
// splitting a family's bundled charge evenly across everyone who shares a payer.
function getRockAcademyAmountForStudentName(studentName){
  const session = getActiveSession();
  if(!session) return 0;
  const target = (studentName||'').trim().toLowerCase();
  let amount = 0;
  for(const band of session.bands){
    for(const m of band.members){
      if(m.freeViaHouseBand) continue;
      if((m.studentName||'').trim().toLowerCase() === target && typeof m.rate === 'number'){
        amount += m.rate;
      }
    }
  }
  return amount;
}

function runReconciliation(salesRows){
  const norm = s => (s||'').toString().trim().toLowerCase();
  const byEmail = {};
  const byClient = {};
  let rosterChanged = false;

  for(const row of salesRows){
    const email = norm(row.Email);
    const client = norm(row.Client);
    const amt = parseMoney(row['Total Paid']);
    const status = (row['Payment Status']||'').trim();
    const items = (row.Items||'');
    const revCat = (row['Revenue Category']||'');
    const collected = (status==='Successful' || status==='Account Debited') ? amt : 0;
    const isRefundCase = (status==='Fully Refunded' || status==='Full Refund');
    const isFail = status==='Failed';
    const hasRock = items.includes('Rock Academy');
    // WellnessLiving labels this explicitly in Revenue Category (e.g. "Administration
    // Fee, Private Lessons") - use that real label instead of guessing from the dollar amount.
    const hasAdminFee = revCat.includes('Administration Fee') || items.includes('Administration Fee');

    if(email && email!=='nan'){
      if(!byEmail[email]) byEmail[email] = {net:0, hasRefund:false, hasRock:false, hasAdminFee:false, adminFeeRowAmounts:[], anyCollected:false, anyFail:false, payer:row.Client};
      const g = byEmail[email];
      g.net += collected; if(isRefundCase) g.hasRefund=true; if(hasRock) g.hasRock=true;
      if(hasAdminFee){ g.hasAdminFee=true; if(collected>0) g.adminFeeRowAmounts.push(collected); }
      if(collected>0) g.anyCollected=true; if(isFail) g.anyFail=true;
    }
    if(client){
      if(!byClient[client]) byClient[client] = {net:0, hasRefund:false, hasRock:false, hasAdminFee:false, adminFeeRowAmounts:[], anyCollected:false, anyFail:false, payer:row.Client};
      const g = byClient[client];
      g.net += collected; if(isRefundCase) g.hasRefund=true; if(hasRock) g.hasRock=true;
      if(hasAdminFee){ g.hasAdminFee=true; if(collected>0) g.adminFeeRowAmounts.push(collected); }
      if(collected>0) g.anyCollected=true; if(isFail) g.anyFail=true;
    }
  }

  const allActive = state.roster.filter(s=>s.active);
  // Founder-family students (Beck/Kissell) get free lessons - no WellnessLiving charge
  // is ever expected for them, so they're handled separately rather than flagged as missing.
  const founderFamilyStudents = allActive.filter(s=>s.isFounderFamily);
  const active = allActive.filter(s=>!s.isFounderFamily);

  // If the exact same student name appears on more than one active roster row (e.g. a
  // student who takes lessons with two different teachers, like a shared band member),
  // always treat those rows as one combined group by name - this is more reliable than
  // trusting that payer/email data was entered identically on both teachers' sheets,
  // which is easy to get slightly out of sync since each sheet is edited separately.
  const nameCounts = {};
  for(const s of active){
    const n = norm(s.studentName);
    nameCounts[n] = (nameCounts[n]||0) + 1;
  }

  const groups = {};
  for(const s of active){
    const nameKey = norm(s.studentName);
    let key = null;
    if(nameCounts[nameKey] > 1){
      key = 'samestudent:'+nameKey;
    } else {
      const email = norm(s.email);
      if(email && byEmail[email]) key = 'email:'+email;
      else {
        const payerGuess = norm(s.payerName || s.studentName);
        if(byClient[payerGuess]) key = 'name:'+payerGuess;
      }
    }
    if(!key) key = 'none:'+s.id;
    if(!groups[key]) groups[key] = [];
    groups[key].push(s);
  }

  const outRows = [];
  const byTeacher = {};
  for(const t of TEACHERS) byTeacher[t] = {matched:0, revenue:0, instructor:0, rent:0, flagged:0};
  let totalRevenue=0, totalInstructor=0, totalRent=0, flaggedCount=0;

  for(const key of Object.keys(groups)){
    const members = groups[key];
    if(key.startsWith('none:')){
      for(const s of members){
        outRows.push({teacher:s.teacher, student:s.studentName, payer:'NOT FOUND', expected:s.monthlyRate, wlCollected:null, flag:'NOT FOUND IN WL EXPORT'});
        flaggedCount++; byTeacher[s.teacher].flagged++;
      }
      continue;
    }
    let idx = null;
    let resolvedEmail = '', resolvedPayer = '';
    if(key.startsWith('email:')){ idx = byEmail[key.slice(6)]; resolvedEmail = key.slice(6); }
    else if(key.startsWith('name:')){ idx = byClient[key.slice(5)]; resolvedPayer = key.slice(5); }
    else if(key.startsWith('samestudent:')){
      // same named student across 2+ teachers - use whichever member's own email/payer
      // actually resolves to a real WL charge, since only one entry might have it filled in
      for(const s of members){
        const email = norm(s.email);
        if(email && byEmail[email]){ idx = byEmail[email]; resolvedEmail = email; break; }
        const payerGuess = norm(s.payerName || s.studentName);
        if(byClient[payerGuess]){ idx = byClient[payerGuess]; resolvedPayer = payerGuess; break; }
      }
    }
    if(!idx){
      // same-named-student group where none of the entries matched any WL charge at all
      for(const s of members){
        outRows.push({teacher:s.teacher, student:s.studentName, payer:'NOT FOUND', expected:s.monthlyRate, wlCollected:null, flag:'NOT FOUND IN WL EXPORT'});
        flaggedCount++; byTeacher[s.teacher].flagged++;
      }
      continue;
    }
    // Each member's OWN combined expected (private lesson + THEIR OWN Rock Academy
    // enrollment specifically, if this transaction includes one) - used to attribute
    // a shared/bundled family charge correctly, rather than splitting it evenly by
    // private-lesson rate alone regardless of who actually has Rock Academy.
    const memberIndividualExpected = {};
    let combinedIndividualExpected = 0;
    for(const s of members){
      const rockAmt = idx.hasRock ? getRockAcademyAmountForStudentName(s.studentName) : 0;
      const ie = (typeof s.monthlyRate === 'number' ? s.monthlyRate : 0) + rockAmt;
      memberIndividualExpected[s.id] = ie;
      combinedIndividualExpected += ie;
    }

    const totalExpected = members.reduce((a,s)=> a + (typeof s.monthlyRate==='number'? s.monthlyRate:0), 0);
    const wl = idx.net;
    let flag = 'OK';
    if(idx.anyFail && !idx.anyCollected) flag = 'UNRESOLVED FAILED PAYMENT — no successful retry found';
    else if(idx.hasRefund) flag = 'REFUND ON ACCOUNT — review manually';
    else if(idx.hasRock){
      // Verify against real Rock Academy rates rather than just assuming the bundle is fine
      const rockInfo = getRockAcademyExpectedForPayer(resolvedEmail, resolvedPayer);
      const combinedExpected = combinedIndividualExpected;
      if(rockInfo.amount > 0 && Math.abs(wl - combinedExpected) < 0.01){
        flag = `includes Rock Academy (${rockInfo.members.join(', ')}) — $${wl.toFixed(2)} collected covers $${totalExpected.toFixed(2)} private lesson + $${rockInfo.amount.toFixed(2)} Rock Academy, fully accounted for`;
      } else {
        flag = `AMOUNT MISMATCH (private + Rock Academy): expected $${combinedExpected.toFixed(2)} ($${totalExpected.toFixed(2)} private + $${rockInfo.amount.toFixed(2)} Rock Academy${rockInfo.amount===0?' — no matching Rock Academy enrollment found':''}), WL collected $${wl.toFixed(2)}`;
      }
    }
    else if(idx.hasAdminFee){
      // WellnessLiving bills this $30 fee on its own automated schedule, independent of
      // whether we've already logged it as paid on our end - so seeing it again for an
      // already-checked student is normal, not an error. As long as the extra amount is
      // cleanly explained by $30 (or there's no extra at all), treat it as accounted for.
      const extraAmount = wl - totalExpected;

      // Still try to attribute a specific charge to a specific unpaid student, purely
      // as a convenience so their box gets checked - not required for this to be OK.
      const unpaidAdminFeeMembers = members.filter(m => !m.adminFeePaid);
      let attributed = null;
      for(const amt of idx.adminFeeRowAmounts){
        const candidates = unpaidAdminFeeMembers.filter(m => Math.abs(amt - (m.monthlyRate + 30)) < 0.01);
        if(candidates.length === 1){ attributed = candidates[0]; break; }
      }
      if(attributed){ attributed.adminFeePaid = true; rosterChanged = true; }

      if(Math.abs(extraAmount) < 0.01){
        flag = 'OK';
      } else if(Math.abs(extraAmount % 30) < 0.01 && extraAmount > 0){
        flag = `includes $30 admin fee (confirmed by WellnessLiving)${attributed ? ` for ${attributed.studentName}` : ''} — $${wl.toFixed(2)} collected covers $${totalExpected.toFixed(2)} lesson + $${extraAmount.toFixed(2)} admin fee`;
      } else {
        flag = `AMOUNT MISMATCH (admin fee included, but total doesn't add up): expected around $${totalExpected.toFixed(2)}, WL collected $${wl.toFixed(2)}`;
      }
    }
    else if(Math.abs(wl - totalExpected) > 0.01){
      const diff = wl - totalExpected;
      const unpaidAdminFeeMembers = members.filter(m => !m.adminFeePaid);
      if(Math.abs(diff - 30) < 0.01 && unpaidAdminFeeMembers.length === 1){
        // Fallback: WellnessLiving didn't explicitly label this one, but the amount
        // still lines up exactly with a single unpaid student's admin fee.
        unpaidAdminFeeMembers[0].adminFeePaid = true;
        rosterChanged = true;
        flag = `includes $30 admin fee — $${wl.toFixed(2)} collected covers $${totalExpected.toFixed(2)} lesson + $30.00 admin fee (marked paid automatically)`;
      } else {
        flag = `AMOUNT MISMATCH: expected $${totalExpected.toFixed(2)}, WL collected $${wl.toFixed(2)}`;
      }
    }
    // A separate, clearly-labeled note (not baked into the flag text itself, so it
    // never risks corrupting exact-match checks like flag==='OK') explaining WHY
    // multiple rows are linked - distinguishing "this is one student who takes
    // lessons with two teachers" from "these are different siblings on one payer."
    let groupNote = null;
    if(members.length > 1){
      if(key.startsWith('samestudent:')){
        const teacherNames = members.map(s=>s.teacher).join(', ');
        groupNote = `Same student — takes lessons with ${members.length} teachers (${teacherNames}); one combined WellnessLiving charge, correctly split above.`;
      } else {
        const names = members.map(s=>s.studentName).join(', ');
        groupNote = `Shared family charge covering ${members.length} students: ${names}.`;
      }
    }
    const accountedFor = isAccountedFor(flag);

    for(const s of members){
      // Show this member's proportional share of the group's collected total, based
      // on their OWN combined expected (private + their own Rock Academy specifically)
      // - not the full group total on every row, and not split evenly regardless of
      // who actually has Rock Academy.
      const share = combinedIndividualExpected>0 ? (memberIndividualExpected[s.id]/combinedIndividualExpected) : (1/members.length);
      const memberCollected = accountedFor ? wl*share : wl;
      outRows.push({teacher:s.teacher, student:s.studentName, payer:idx.payer, expected:s.monthlyRate, wlCollected: Math.round(memberCollected*100)/100, flag, groupNote});
      const bt = byTeacher[s.teacher];
      if(accountedFor){
        bt.matched++;
        const rev = wl*share;
        totalRevenue += rev; bt.revenue += rev;
        // Instructor/rent stays based on private-lesson rate alone - Rock Academy pay
        // is computed and tracked entirely separately (its own per-class rate), so
        // folding it in here too would double-count it.
        const instr = s.monthlyRate * 0.6356; // ~75/118 standard instructor ratio, rounded to nearest .50 skipped here for summary-level rollup
        const rent = s.monthlyRate - instr;
        totalInstructor += instr; bt.instructor += instr;
        totalRent += rent; bt.rent += rent;
      } else {
        flaggedCount++; bt.flagged++;
      }
    }
  }

  // Founder-family (Beck/Kissell) students: free lessons, never expected in the
  // WellnessLiving export. Teacher still earns the standard $75 - funded from the
  // studio's rent budget rather than from any student payment.
  for(const s of founderFamilyStudents){
    outRows.push({teacher:s.teacher, student:s.studentName, payer:s.payerName||s.studentName,
      expected:0, wlCollected:0, flag:'OK'});
    const bt = byTeacher[s.teacher];
    bt.matched++;
    totalInstructor += 75; bt.instructor += 75;
    totalRent -= 75; bt.rent -= 75;
  }

  return {
    rows: outRows,
    summary: { totalRevenue, totalInstructor, totalRent, flaggedCount, byTeacher },
    rosterChanged
  };
}

// ---------- Google Sign-In gate ----------
const GOOGLE_CLIENT_ID_FRONTEND = '438271393449-9o8n4ihtr7iuvj46cles9vksvc79a409.apps.googleusercontent.com';

function showSignInScreen(errorMsg){
  const root = document.getElementById('mc-root');
  root.innerHTML = `
    <div style="max-width:340px; margin:80px auto; text-align:center; font-family:var(--sans);">
      <div style="font-size:20px; font-weight:800; margin-bottom:4px;">Madcap <span style="color:var(--amber-deep)">Payroll &amp; P&amp;L</span></div>
      <div style="font-size:12px; color:var(--muted); margin-bottom:20px;">Sign in with your Google account to continue</div>
      <div id="mc-google-signin-btn" style="display:flex; justify-content:center;"></div>
      <div id="mc-signin-status" class="mc-small" style="margin-top:14px; color:var(--muted);"></div>
      ${errorMsg ? `<div style="color:var(--warn); font-size:12px; margin-top:10px;">${esc(errorMsg)}</div>` : ''}
    </div>`;
  renderGoogleButton();
}

let _googleSignInInitialized = false;
function renderGoogleButton(){
  if(!window.google || !window.google.accounts || !window.google.accounts.id){
    setTimeout(renderGoogleButton, 300);
    return;
  }
  if(!_googleSignInInitialized){
    google.accounts.id.initialize({
      client_id: GOOGLE_CLIENT_ID_FRONTEND,
      callback: handleGoogleCredential,
      use_fedcm_for_prompt: true,
      use_fedcm_for_button: true,
    });
    _googleSignInInitialized = true;
  }
  const target = document.getElementById('mc-google-signin-btn');
  if(target){
    google.accounts.id.renderButton(target, { theme: 'outline', size: 'large', text: 'signin_with' });
  }
}

async function handleGoogleCredential(response){
  const statusEl = document.getElementById('mc-signin-status');
  if(statusEl) statusEl.textContent = 'Checking…';
  const idToken = response.credential;
  const result = await backendGoogleLogin(idToken, null, (attempt)=>{
    if(statusEl && attempt > 1) statusEl.textContent = `Still checking… (attempt ${attempt} of 4)`;
  });
  if(result.unauthorized){
    const msg = result.reason === 'not_allowed'
      ? "That Google account isn't on the approved list for this app."
      : 'Sign-in could not be verified — please try again.' + (result.detail ? ` (${result.detail})` : '');
    showSignInScreen(msg);
    return;
  }
  if(result.serverError){
    showSignInScreen('Server error during sign-in: ' + (result.message || 'unknown error'));
    return;
  }
  if(result.networkError){
    showSignInScreen('Could not reach the server after several tries. Please try signing in again.');
    return;
  }
  SESSION_TOKEN = result.sessionToken;
  USER_EMAIL = result.email;
  try{ localStorage.setItem('madcap_session_token', result.sessionToken); }catch(e){}
  boot();
}

async function boot(){
  const root = document.getElementById('mc-root');
  const app = document.getElementById('mc-app');
  if(root) root.innerHTML = '';
  if(app) app.style.display = '';
  await loadState();
  renderAll();
}

// ---------- boot ----------
(async function initGate(){
  let saved = null;
  try{ saved = localStorage.getItem('madcap_session_token'); }catch(e){}
  if(saved){
    SESSION_TOKEN = saved;
    const root = document.getElementById('mc-root');
    root.innerHTML = `<div style="max-width:340px; margin:80px auto; text-align:center; font-family:var(--sans); color:var(--muted); font-size:13px;">Loading…</div>`;
    const test = await backendGet('roster', null, (attempt)=>{
      if(attempt > 1) root.innerHTML = `<div style="max-width:340px; margin:80px auto; text-align:center; font-family:var(--sans); color:var(--muted); font-size:13px;">Still loading… (attempt ${attempt} of 4)</div>`;
    });
    if(test.unauthorized){
      SESSION_TOKEN = null;
      try{ localStorage.removeItem('madcap_session_token'); }catch(e){}
      showSignInScreen('Your session expired — please sign in again.');
    } else if(test.networkError){
      showSignInScreen('Could not reach the server after several tries. Please try signing in again.');
    } else {
      boot();
    }
  } else {
    showSignInScreen(null);
  }
})();

})();
</script>
